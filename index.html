<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Taller de Joyería Kerim — Galería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafafa; --bg-soft: #ffffff; --surface: #ffffff; --surface-alt: #fafafa; --surface-inset: #f0f0f0;
    --ink: #0a0a0a; --text: #0a0a0a; --text-2: #3a3a3a; --text-3: #7a7a7a; --text-4: #a8a6a0;
    --border: #efefef; --border-soft: #ececec; --border-mid: #dbdbdb;
    --like: #ed4956; --accent: #0095f6;
    --radius-sm: 8px; --radius: 14px; --radius-lg: 20px; --radius-xl: 26px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
    --shadow: 0 4px 14px rgba(0,0,0,0.06);
    --shadow-md: 0 10px 28px rgba(0,0,0,0.08);
    --shadow-lg: 0 24px 48px rgba(0,0,0,0.16);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    padding-bottom: calc(70px + var(--safe-bottom));
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 8px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; }
  img { display: block; max-width: 100%; }

  .app-shell {
    max-width: 935px; margin: 0 auto; padding: 0 0 20px; background: var(--bg-soft);
    min-height: 100vh; border-left: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft);
  }

  /* TOPBAR */
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0;
  }
  .brand-text h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.05rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
  .brand-text h1 span { font-style: italic; background: linear-gradient(135deg, #f09433 0%, #dc2743 50%, #bc1888 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .topbar-actions { display: flex; align-items: center; gap: 14px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-size: 1.2rem; transition: background 0.15s; color: var(--text);
  }
  .icon-btn:hover { background: var(--surface-inset); }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.65rem; font-weight: 500; color: var(--text-3);
    padding: 3px 10px 3px 8px; border-radius: 99px;
    background: var(--surface-alt); border: 1px solid var(--border);
    cursor: pointer; user-select: none; transition: all 0.2s;
    max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sync-badge:hover { background: var(--surface-inset); }
  .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #8a8a8a; flex-shrink: 0; transition: all 0.3s; }
  .sync-badge.online { color: #047857; background: #ecfdf5; border-color: rgba(5,150,105,0.3); }
  .sync-badge.online .dot { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.9); }
  .sync-badge.offline .dot { background: #fbbf24; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* STORIES */
  .stories-bar {
    display: flex; gap: 16px; overflow-x: auto; padding: 14px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .stories-bar::-webkit-scrollbar { display: none; }
  .story {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    flex-shrink: 0; cursor: pointer; width: 66px;
  }
  .story-ring {
    width: 60px; height: 60px; border-radius: 50%; padding: 2.5px;
    background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    display: grid; place-items: center;
  }
  .story-ring.neutral { background: linear-gradient(135deg, #d4d4d4 0%, #a3a3a3 100%); }
  .story-inner {
    width: 100%; height: 100%; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--surface); display: grid; place-items: center;
    font-size: 1.3rem; overflow: hidden;
  }
  .story-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .story-label { font-size: 0.62rem; font-weight: 600; color: var(--text-2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 66px; }
  .story-add .story-inner { background: var(--surface-alt); color: var(--text-3); font-size: 1.6rem; border: 2px dashed var(--border-mid); }

  /* FEED */
  .feed { padding: 0; }
  .post {
    background: var(--surface); border-bottom: 1px solid var(--border);
    animation: fadeUp 0.3s ease-out;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .post-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .post-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-size: 1.05rem; overflow: hidden;
    background: var(--surface-inset);
  }
  .post-user { flex: 1; min-width: 0; }
  .post-user .username { font-size: 0.85rem; font-weight: 700; }
  .post-user .post-meta { font-size: 0.7rem; color: var(--text-3); margin-top: 1px; }
  .post-more { font-size: 1.2rem; color: var(--text-3); padding: 4px 8px; border-radius: 50%; transition: background 0.15s; }
  .post-more:hover { background: var(--surface-inset); }

  /* Imagen protagonista */
  .post-image-wrap {
    position: relative; width: 100%; background: #000; overflow: hidden;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .post-image-wrap img { width: 100%; max-height: 600px; object-fit: cover; display: block; }

  .post-actions { display: flex; align-items: center; gap: 4px; padding: 10px 16px 6px; }
  .pa-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px;
    font-size: 0.82rem; font-weight: 600; color: var(--text-2); border-radius: 8px;
    transition: all 0.15s;
  }
  .pa-btn:hover { background: var(--surface-inset); }
  .pa-btn.liked { color: var(--like); }
  .pa-btn.liked .pa-icon { animation: heartPop 0.3s ease; }
  @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .pa-icon { font-size: 1.15rem; line-height: 1; }
  .pa-spacer { flex: 1; }

  .post-caption { padding: 4px 16px 6px; font-size: 0.85rem; line-height: 1.5; color: var(--text-2); }
  .post-caption b { color: var(--text); font-weight: 700; }
  .post-caption .hashtag { color: var(--accent); font-weight: 600; }
  .post-time { padding: 0 16px 14px; font-size: 0.65rem; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500; }

  /* Empty state */
  .empty-feed { text-align: center; padding: 60px 24px; color: var(--text-3); }
  .empty-feed .icon { font-size: 3.5rem; display: block; margin-bottom: 16px; opacity: 0.4; }
  .empty-feed h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty-feed p { font-size: 0.88rem; line-height: 1.6; max-width: 300px; margin: 0 auto 20px; }
  .empty-feed .cta-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem; transition: all 0.18s;
  }
  .empty-feed .cta-btn:hover { background: #0077cc; transform: translateY(-1px); }

  /* PERFIL (galería) */
  .profile-header { padding: 20px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .profile-top { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .profile-avatar {
    width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #f09433 0%, #dc2743 50%, #bc1888 100%);
    display: grid; place-items: center; font-size: 2.2rem; color: #fff;
    padding: 3px;
  }
  .profile-avatar .pa-emoji { background: #fff; width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; }
  .profile-info { flex: 1; }
  .profile-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .profile-handle { font-size: 0.82rem; color: var(--text-3); margin-bottom: 8px; }
  .profile-bio { font-size: 0.82rem; color: var(--text-2); line-height: 1.5; }
  .profile-bio b { font-weight: 700; color: var(--text); }

  /* Grid galería */
  .gallery-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    padding: 2px; background: var(--bg);
  }
  .gallery-item {
    position: relative; aspect-ratio: 1/1; overflow: hidden; cursor: pointer;
    background: var(--surface-inset);
  }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .gallery-item:hover img { transform: scale(1.05); }
  .gallery-item .gi-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    opacity: 0; transition: opacity 0.2s; color: #fff; font-size: 0.85rem; font-weight: 700;
  }
  .gallery-item:hover .gi-overlay { opacity: 1; }
  .gallery-empty { padding: 50px 20px; text-align: center; color: var(--text-3); font-size: 0.88rem; }
  .gallery-empty .icon { font-size: 3rem; display: block; margin-bottom: 12px; opacity: 0.4; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 0 calc(8px + var(--safe-bottom));
    max-width: 935px; margin: 0 auto;
  }
  .bn-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 16px; font-size: 0.6rem; font-weight: 600; color: var(--text-3);
    transition: all 0.15s; border-radius: 8px; position: relative;
  }
  .bn-btn:hover { color: var(--text); }
  .bn-btn.active { color: var(--text); }
  .bn-icon { font-size: 1.35rem; line-height: 1; transition: transform 0.15s; }
  .bn-btn.active .bn-icon { transform: scale(1.08); }
  .bn-btn.add-btn .bn-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-size: 1.5rem; font-weight: 300; box-shadow: 0 2px 8px rgba(0,149,246,0.35);
  }
  .bn-btn.add-btn { margin-top: -4px; }

  /* MODALES */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,10,10,0.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000;
  }
  .modal-overlay.activo { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius-xl); padding: 24px;
    width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    box-shadow: var(--shadow-lg); animation: modalIn 0.28s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  .modal-handle { display: none; width: 40px; height: 4px; background: var(--border-mid); border-radius: 99px; margin: 0 auto 14px; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--text-2); margin-bottom: 7px; }
  .field label span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-4); font-size: 0.66rem; }
  .field textarea {
    width: 100%; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--border-soft);
    background: var(--surface-alt); font-size: 0.9rem; font-weight: 500; color: var(--text);
    outline: none; transition: all 0.18s; resize: vertical; min-height: 54px;
  }
  .field textarea:hover { border-color: var(--border-mid); }
  .field textarea:focus { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 3px rgba(10,10,10,0.08); }

  .upload-zone {
    position: relative; border: 1.5px dashed var(--border-mid); border-radius: 12px;
    background: var(--surface-alt); transition: all 0.18s; overflow: hidden;
    min-height: 84px; display: grid; place-items: center;
  }
  .upload-zone:hover { border-color: var(--ink); background: var(--surface-inset); }
  .upload-zone input[type="file"] { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .upload-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; color: var(--text-3); font-size: 0.76rem; font-weight: 500; text-align: center; }
  .upload-icon { font-size: 1.5rem; }
  .upload-btns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .upload-btn {
    padding: 9px 16px; border-radius: 9px; font-size: 0.78rem; font-weight: 700;
    border: 1px solid var(--border-mid); background: #fff; color: var(--text-2);
    transition: all 0.18s; display: inline-flex; align-items: center; gap: 5px;
  }
  .upload-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); transform: translateY(-1px); }
  .upload-preview { width: 100%; max-height: 240px; object-fit: cover; border-radius: 11px; }
  .upload-clear {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
    border-radius: 50%; background: rgba(10,10,10,0.7); color: #fff;
    font-size: 0.8rem; display: grid; place-items: center; z-index: 2;
  }
  .upload-required-note {
    font-size: 0.7rem; color: #dc2626; font-weight: 600; margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .modal-actions button { flex: 1; padding: 13px 18px; border-radius: 11px; font-size: 0.88rem; font-weight: 700; transition: all 0.18s; }
  .btn-cancel { background: var(--surface-alt); color: var(--text-2); border: 1px solid var(--border-soft); }
  .btn-cancel:hover { background: var(--surface-inset); }
  .btn-primary { color: #fff; background: linear-gradient(135deg, #0095f6 0%, #0077cc 100%); }
  .btn-primary:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

  .tag-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .cat-opt {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px;
    border-radius: 10px; border: 1px solid var(--border-soft); background: var(--surface-alt);
    font-size: 0.64rem; font-weight: 600; color: var(--text-3); transition: all 0.15s; text-align: center;
  }
  .cat-opt .cat-icon { font-size: 1.15rem; line-height: 1; }
  .cat-opt:hover { border-color: var(--border-mid); background: var(--surface-inset); }
  .cat-opt.selected { border-color: var(--ink); background: var(--ink); color: #fff; }

  .detail-image { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: #000; }
  .detail-image img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
  .detail-caption { font-size: 0.9rem; color: var(--text-2); line-height: 1.55; margin-bottom: 14px; }
  .detail-caption b { color: var(--text); }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .detail-tag {
    padding: 5px 12px; border-radius: 99px; font-size: 0.72rem; font-weight: 600;
    background: var(--surface-alt); border: 1px solid var(--border-soft); color: var(--text-2);
  }
  .btn-delete-detail {
    width: 100%; padding: 12px; border-radius: 11px; background: #fef2f2; color: #dc2626;
    border: 1px solid rgba(220,38,38,0.2); font-size: 0.86rem; font-weight: 700;
    transition: all 0.18s; margin-top: 4px;
  }
  .btn-delete-detail:hover { background: #dc2626; color: #fff; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 99px;
    font-size: 0.84rem; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 2000;
    opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: #047857; }
  .toast.error { background: #b91c1c; }

  @media (max-width: 700px) {
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal { max-width: 100%; border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-height: 92vh; padding: 14px 18px calc(24px + var(--safe-bottom)); }
    .modal-handle { display: block; }
    .modal-actions { flex-direction: column-reverse; }
    .modal-actions button { width: 100%; }
    .post-image-wrap img { max-height: 500px; }
  }
  @media (max-width: 520px) {
    .app-shell { border: none; }
    .brand-text h1 { font-size: 0.95rem; }
    .story { width: 60px; }
    .story-ring { width: 54px; height: 54px; }
    .story-label { font-size: 0.58rem; max-width: 60px; }
    .profile-header { padding: 16px 12px; }
    .profile-avatar { width: 64px; height: 64px; font-size: 1.8rem; }
    .bn-btn { padding: 6px 12px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">💎</div>
      <div class="brand-text"><h1>Taller de <span>Joyería Kerim</span></h1></div>
    </div>
    <div class="topbar-actions">
      <span class="sync-badge" id="syncBadge" title="Click para reintentar sincronización">
        <span class="dot"></span><span id="syncText">Conectando…</span>
      </span>
      <button class="icon-btn" id="btnNotif" title="Notificaciones">🔔</button>
    </div>
  </header>

  <div class="stories-bar" id="storiesBar"></div>

  <div id="viewFeed" class="view active">
    <div class="feed" id="feedContainer"></div>
  </div>

  <div id="viewProfile" class="view" style="display:none;">
    <div class="profile-header">
      <div class="profile-top">
        <div class="profile-avatar" id="profileAvatar"><span class="pa-emoji">💎</span></div>
        <div class="profile-info">
          <div class="profile-name">Taller de Joyería Kerim</div>
          <div class="profile-handle">@joyeria_kerim</div>
          <div class="profile-bio"><b>💎 Galería de creaciones</b><br>Cada pieza cuenta una historia. Comparte tus joyas, procesos y momentos del taller.</div>
        </div>
      </div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bn-btn active" data-nav="feed"><span class="bn-icon">🏠</span><span>Inicio</span></button>
  <button class="bn-btn add-btn" data-nav="add"><span class="bn-icon">＋</span><span>Publicar</span></button>
  <button class="bn-btn" data-nav="profile"><span class="bn-icon">👤</span><span>Perfil</span></button>
</nav>

<!-- MODAL: PUBLICAR -->
<div class="modal-overlay" id="modalPublicar">
  <div class="modal sheet">
    <div class="modal-handle"></div>
    <h3>✨ Nueva publicación</h3>
    <form id="formPublicar" autocomplete="off">
      <div class="field">
        <label>Foto <span>(requerida)</span></label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fotoPub" accept="image/*">
          <input type="file" id="fotoPubCam" accept="image/*" capture="environment">
          <div class="upload-empty" id="uploadEmpty">
            <span class="upload-icon">📸</span>
            <div style="font-weight:600;color:var(--text-2);">Elige una foto para compartir</div>
            <div class="upload-btns">
              <button type="button" class="upload-btn" id="btnCamara">📷 Cámara</button>
              <button type="button" class="upload-btn" id="btnGaleria">🖼️ Galería</button>
            </div>
          </div>
          <img id="fotoPreview" class="upload-preview" hidden alt="Vista previa">
          <button type="button" class="upload-clear" id="uploadClear" hidden aria-label="Quitar foto">✕</button>
        </div>
        <div class="upload-required-note" id="fotoRequeridaNote" style="display:none;">⚠️ Debes subir una foto para publicar</div>
      </div>
      <div class="field">
        <label for="piePub">Pie de foto <span>(opcional)</span></label>
        <textarea id="piePub" rows="3" maxlength="300" placeholder="Escribe algo sobre esta joya o momento…"></textarea>
      </div>
      <div class="field">
        <label>Etiqueta <span>(opcional)</span></label>
        <div class="tag-picker" id="tagPicker"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" data-close>Cancelar</button>
        <button type="submit" class="btn-primary" id="btnPublicarSubmit">Publicar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: DETALLE -->
<div class="modal-overlay" id="modalDetalle">
  <div class="modal sheet">
    <div class="modal-handle"></div>
    <div id="detalleContenido"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRlaSOCzPZp1aToRHWMHwgOt62GWrSkLk",
  authDomain: "taller-de-joyeria-kerim.firebaseapp.com",
  projectId: "taller-de-joyeria-kerim",
  storageBucket: "taller-de-joyeria-kerim.firebasestorage.app",
  messagingSenderId: "727768856341",
  appId: "1:727768856341:web:2912c967a918314ec79b1c",
  measurementId: "G-RL3FTVEJBX"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_REF = doc(db, 'finanzas', 'registros');

const MAX_REGISTROS = 2000;
const MAX_COMPROBANTE_CHARS = 800000;
const MAX_PAYLOAD_BYTES = 950000;
const CLAVE = 'kerim_joyeria_v1';

// Etiquetas del taller de joyería
const ETIQUETAS = [
  { id: 'anillo',    nombre: 'Anillo',    icon: '💍' },
  { id: 'collar',    nombre: 'Collar',    icon: '📿' },
  { id: 'pulsera',   nombre: 'Pulsera',   icon: '⛓️' },
  { id: 'aretes',    nombre: 'Aretes',    icon: '💎' },
  { id: 'proceso',   nombre: 'Proceso',   icon: '🔨' },
  { id: 'material',  nombre: 'Material',  icon: '🪙' },
  { id: 'diseno',    nombre: 'Diseño',    icon: '✏️' },
  { id: 'otro',      nombre: 'Otro',      icon: '📷' }
];
function getEtiqueta(id) { return ETIQUETAS.find(e => e.id === id) || ETIQUETAS[ETIQUETAS.length - 1]; }

let posts = [];
let currentView = 'feed';
let selectedTag = 'anillo';
let fotoTemp = null;
let likedPosts = new Set(JSON.parse(localStorage.getItem('kerim_likes_v1') || '[]'));

function claveDia(d) {
  try { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  catch { return '1970-01-01'; }
}
function fechaDesdeClave(clave) {
  if (typeof clave !== 'string') return new Date(0);
  const parts = clave.split('-');
  if (parts.length !== 3) return new Date(0);
  const a = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
  if (!Number.isFinite(a)||!Number.isFinite(m)||!Number.isFinite(d)) return new Date(0);
  if (m<1||m>12||d<1||d>31) return new Date(0);
  return new Date(a, m-1, d);
}
function timeAgo(fecha) {
  const diff = Date.now() - fecha.getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'ahora';
  if (mins < 60) return `hace ${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `hace ${hrs}h`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `hace ${days}d`;
  return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}
function fechaLarga(d) {
  try { return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  catch { return '—'; }
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sanitizarPost(r) {
  if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
  let foto = r.foto || r.comprobante;
  if (typeof foto !== 'string' || foto.length === 0 || foto.length > MAX_COMPROBANTE_CHARS) return null;
  let caption = typeof r.caption === 'string' ? r.caption.slice(0, 500) : (typeof r.descripcion === 'string' ? r.descripcion.slice(0, 500) : '');
  let etiqueta = typeof r.etiqueta === 'string' && r.etiqueta.length > 0 ? r.etiqueta.slice(0, 30) : 'otro';
  let dia = typeof r.dia === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.dia) ? r.dia : claveDia(new Date());
  let hora = typeof r.hora === 'string' && r.hora.length > 0 && r.hora.length <= 12 ? r.hora : '00:00:00';
  let id = typeof r.id === 'string' && r.id.length > 0 && r.id.length <= 64 ? r.id : Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  let marcaTiempo = Number.isFinite(r.marcaTiempo) && r.marcaTiempo > 0 ? r.marcaTiempo : fechaDesdeClave(dia).getTime() || Date.now();
  return { id, foto, caption, etiqueta, dia, hora, marcaTiempo };
}

function setSyncEstado(estado, texto) {
  const badge = document.getElementById('syncBadge');
  const label = document.getElementById('syncText');
  if (!badge || !label) return;
  badge.classList.remove('online', 'offline');
  if (estado === 'online') badge.classList.add('online');
  if (estado === 'offline') badge.classList.add('offline');
  label.textContent = texto;
}

function cargarLocal() {
  try {
    const datos = JSON.parse(localStorage.getItem(CLAVE));
    const arr = Array.isArray(datos) ? datos : [];
    const limpios = [];
    for (let i = 0; i < arr.length; i++) { const s = sanitizarPost(arr[i]); if (s) limpios.push(s); }
    posts = limpios;
  } catch (e) { posts = []; }
}
function guardarLocal() {
  try { localStorage.setItem(CLAVE, JSON.stringify(posts)); } catch (e) {}
}
async function sincronizar() {
  try {
    if (posts.length > MAX_REGISTROS) { setSyncEstado('offline', 'Límite alcanzado'); return false; }
    const payload = { registros: posts };
    const bytes = new Blob([JSON.stringify(payload)]).size;
    if (bytes > MAX_PAYLOAD_BYTES) { setSyncEstado('offline', 'Datos muy grandes'); return false; }
    await setDoc(DOC_REF, payload);
    setSyncEstado('online', 'Sincronizado');
    return true;
  } catch (e) { setSyncEstado('offline', 'Error de sync'); return false; }
}
async function guardar() { guardarLocal(); return await sincronizar(); }

/* STORIES */
function renderStories() {
  const bar = document.getElementById('storiesBar');
  if (!bar) return;
  const recientes = [...posts].sort((a,b) => b.marcaTiempo - a.marcaTiempo).slice(0, 10);
  let html = `<div class="story story-add" data-action="add"><div class="story-ring neutral"><div class="story-inner">＋</div></div><span class="story-label">Publicar</span></div>`;
  if (recientes.length === 0) {
    html += `<div class="story"><div class="story-ring neutral"><div class="story-inner">💎</div></div><span class="story-label">Sin fotos</span></div>`;
  } else {
    recientes.forEach(p => {
      html += `<div class="story" data-id="${escapeHtml(p.id)}">
        <div class="story-ring"><div class="story-inner"><img src="${p.foto}" alt=""></div></div>
        <span class="story-label">${escapeHtml(getEtiqueta(p.etiqueta).nombre)}</span>
      </div>`;
    });
  }
  bar.innerHTML = html;
  bar.querySelectorAll('.story[data-id]').forEach(el => el.addEventListener('click', () => openDetalle(el.dataset.id)));
  bar.querySelector('[data-action="add"]')?.addEventListener('click', openModalPublicar);
}

/* FEED */
function renderFeed() {
  const cont = document.getElementById('feedContainer');
  if (!cont) return;
  const ordenados = [...posts].sort((a,b) => b.marcaTiempo - a.marcaTiempo);
  if (ordenados.length === 0) {
    cont.innerHTML = `<div class="empty-feed">
      <span class="icon">💎</span>
      <h2>La galería está vacía</h2>
      <p>Comparte tu primera pieza o momento del taller. Una imagen, una historia.</p>
      <button class="cta-btn" onclick="document.querySelector('.add-btn').click()">📸 Crear primera publicación</button>
    </div>`;
    return;
  }
  cont.innerHTML = ordenados.map(renderPostHTML).join('');
}

function renderPostHTML(p) {
  try {
    const et = getEtiqueta(p.etiqueta);
    const liked = likedPosts.has(p.id);
    const fecha = fechaDesdeClave(p.dia);
    const ago = timeAgo(fecha);
    return `<article class="post" data-id="${escapeHtml(p.id)}">
      <div class="post-header">
        <div class="post-avatar" style="background:var(--surface-inset)">💎</div>
        <div class="post-user">
          <div class="username">@joyeria_kerim</div>
          <div class="post-meta">${fechaLarga(fecha)}</div>
        </div>
        <button class="post-more" data-more-id="${escapeHtml(p.id)}">⋯</button>
      </div>
      <div class="post-image-wrap" data-id="${escapeHtml(p.id)}">
        <img src="${p.foto}" alt="Publicación" loading="lazy">
      </div>
      <div class="post-actions">
        <button class="pa-btn like-btn ${liked?'liked':''}" data-like-id="${escapeHtml(p.id)}">
          <span class="pa-icon">${liked?'❤️':'🤍'}</span>
        </button>
        <button class="pa-btn" data-comment-id="${escapeHtml(p.id)}"><span class="pa-icon">💬</span></button>
        <button class="pa-btn" data-share-id="${escapeHtml(p.id)}"><span class="pa-icon">📤</span></button>
        <div class="pa-spacer"></div>
        <button class="pa-btn" data-save-id="${escapeHtml(p.id)}"><span class="pa-icon">🔖</span></button>
      </div>
      ${p.caption ? `<div class="post-caption"><b>@joyeria_kerim</b> ${escapeHtml(p.caption)}</div>` : `<div class="post-caption"><b>@joyeria_kerim</b> 💎</div>`}
      <div class="post-caption" style="padding-top:0;color:var(--accent);font-size:0.76rem;">#${et.nombre.toLowerCase().replace(/\s/g,'')} #joyeriakerim</div>
      <div class="post-time">${ago}</div>
    </article>`;
  } catch (e) { return ''; }
}

function attachFeedEvents() {
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.likeId;
      if (likedPosts.has(id)) likedPosts.delete(id); else likedPosts.add(id);
      localStorage.setItem('kerim_likes_v1', JSON.stringify([...likedPosts]));
      renderFeed(); attachFeedEvents();
    });
  });
  document.querySelectorAll('[data-more-id]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openDetalle(btn.dataset.moreId); }));
  document.querySelectorAll('[data-comment-id]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openDetalle(btn.dataset.commentId); }));
  document.querySelectorAll('[data-share-id]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); toast('Enlace copiado', 'success'); }));
  document.querySelectorAll('[data-save-id]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); toast('Publicación guardada', 'success'); }));
  document.querySelectorAll('.post-image-wrap[data-id]').forEach(el => el.addEventListener('click', () => openDetalle(el.dataset.id)));
}

/* PERFIL */
function renderProfile() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  const ordenados = [...posts].sort((a,b) => b.marcaTiempo - a.marcaTiempo);
  if (ordenados.length === 0) {
    grid.innerHTML = `<div class="gallery-empty" style="grid-column:1/-1;"><span class="icon">💎</span>Aún no hay publicaciones.<br>Toca ＋ para compartir tu primera pieza.</div>`;
    return;
  }
  grid.innerHTML = ordenados.map(p => `<div class="gallery-item" data-id="${escapeHtml(p.id)}">
    <img src="${p.foto}" alt="Publicación" loading="lazy">
    <div class="gi-overlay"><span>❤️</span><span>💬</span></div>
  </div>`).join('');
  grid.querySelectorAll('.gallery-item').forEach(el => el.addEventListener('click', () => openDetalle(el.dataset.id)));
}

function renderAll() {
  renderStories();
  renderFeed();
  attachFeedEvents();
  renderProfile();
}

/* NAVEGACIÓN */
function switchView(view) {
  currentView = view;
  document.getElementById('viewFeed').style.display = view === 'feed' ? 'block' : 'none';
  document.getElementById('viewProfile').style.display = view === 'profile' ? 'block' : 'none';
  document.querySelectorAll('.bn-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === view));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('.bn-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const nav = btn.dataset.nav;
    if (nav === 'add') openModalPublicar();
    else switchView(nav);
  });
});

/* MODALES */
function openModal(id) { document.getElementById(id).classList.add('activo'); document.body.style.overflow = 'hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('activo'); document.body.style.overflow = ''; }
function closeAllModals() { document.querySelectorAll('.modal-overlay.activo').forEach(m => m.classList.remove('activo')); document.body.style.overflow = ''; }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAllModals));
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeAllModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllModals(); });

/* PUBLICAR */
function renderTagPicker() {
  const cont = document.getElementById('tagPicker');
  if (!cont) return;
  cont.innerHTML = ETIQUETAS.map(t => `<button type="button" class="cat-opt ${t.id === selectedTag ? 'selected' : ''}" data-tag="${t.id}"><span class="cat-icon">${t.icon}</span><span>${t.nombre}</span></button>`).join('');
  cont.querySelectorAll('.cat-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      cont.querySelectorAll('.cat-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTag = btn.dataset.tag;
    });
  });
}

function openModalPublicar() {
  selectedTag = 'anillo';
  fotoTemp = null;
  document.getElementById('piePub').value = '';
  const preview = document.getElementById('fotoPreview');
  const empty = document.getElementById('uploadEmpty');
  const clear = document.getElementById('uploadClear');
  const input = document.getElementById('fotoPub');
  const inputCam = document.getElementById('fotoPubCam');
  const note = document.getElementById('fotoRequeridaNote');
  preview.hidden = true; preview.src = '';
  empty.hidden = false; clear.hidden = true;
  if (note) note.style.display = 'none';
  input.value = ''; if (inputCam) inputCam.value = '';
  renderTagPicker();
  openModal('modalPublicar');
  setTimeout(() => document.getElementById('fotoPub').click(), 300);
}

document.getElementById('formPublicar').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!fotoTemp) {
    document.getElementById('fotoRequeridaNote').style.display = 'flex';
    toast('Debes subir una foto para publicar', 'error');
    document.getElementById('uploadZone').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const ahora = new Date();
  const nuevo = sanitizarPost({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    foto: fotoTemp,
    caption: document.getElementById('piePub').value.trim(),
    etiqueta: selectedTag,
    dia: claveDia(ahora),
    hora: String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0')+':'+String(ahora.getSeconds()).padStart(2,'0'),
    marcaTiempo: ahora.getTime()
  });
  if (!nuevo) { toast('No se pudo publicar', 'error'); return; }
  posts.push(nuevo);
  guardarLocal(); renderAll(); guardar();
  closeModal('modalPublicar');
  toast('¡Publicado! 💎', 'success');
  switchView('feed');
});

/* IMAGEN */
function comprimirImagen(file, maxSize = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) { const scale = maxSize / Math.max(width, height); width = Math.round(width * scale); height = Math.round(height * scale); }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
document.getElementById('fotoPub').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { toast('El archivo debe ser una imagen', 'error'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('Imagen demasiado grande (máx 8MB)', 'error'); return; }
  try {
    const dataUrl = await comprimirImagen(file);
    if (dataUrl.length > MAX_COMPROBANTE_CHARS) { toast('Imagen demasiado grande', 'error'); return; }
    fotoTemp = dataUrl;
    const preview = document.getElementById('fotoPreview');
    preview.src = dataUrl; preview.hidden = false;
    document.getElementById('uploadEmpty').hidden = true;
    document.getElementById('uploadClear').hidden = false;
    document.getElementById('fotoRequeridaNote').style.display = 'none';
  } catch (err) { toast('No se pudo procesar la imagen', 'error'); }
});
document.getElementById('fotoPubCam').addEventListener('change', (e) => {
  document.getElementById('fotoPub').files = e.target.files;
  document.getElementById('fotoPub').dispatchEvent(new Event('change'));
});
document.getElementById('btnCamara').addEventListener('click', () => document.getElementById('fotoPubCam').click());
document.getElementById('btnGaleria').addEventListener('click', () => document.getElementById('fotoPub').click());
document.getElementById('uploadClear').addEventListener('click', (e) => {
  e.stopPropagation();
  fotoTemp = null;
  document.getElementById('fotoPub').value = '';
  document.getElementById('fotoPubCam').value = '';
  document.getElementById('fotoPreview').src = '';
  document.getElementById('fotoPreview').hidden = true;
  document.getElementById('uploadEmpty').hidden = false;
  document.getElementById('uploadClear').hidden = true;
});

/* DETALLE */
function openDetalle(id) {
  try {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    const et = getEtiqueta(p.etiqueta);
    const cont = document.getElementById('detalleContenido');
    cont.innerHTML = `
      <div class="detail-image"><img src="${p.foto}" alt="Publicación"></div>
      ${p.caption ? `<div class="detail-caption"><b>@joyeria_kerim</b> ${escapeHtml(p.caption)}</div>` : `<div class="detail-caption"><b>@joyeria_kerim</b> 💎</div>`}
      <div class="detail-tags">
        <span class="detail-tag">${et.icon} ${et.nombre}</span>
        <span class="detail-tag">📅 ${fechaLarga(fechaDesdeClave(p.dia))}</span>
      </div>
      <button class="btn-delete-detail" data-delete-id="${escapeHtml(p.id)}">🗑 Eliminar publicación</button>`;
    cont.querySelector('[data-delete-id]').addEventListener('click', () => {
      closeModal('modalDetalle');
      setTimeout(() => eliminarPost(p.id), 200);
    });
    openModal('modalDetalle');
  } catch (e) { toast('Error al abrir', 'error'); }
}
async function eliminarPost(id) {
  try {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    let ok = false;
    try { ok = confirm('¿Eliminar esta publicación?'); } catch { ok = true; }
    if (!ok) return;
    posts = posts.filter(x => x.id !== id);
    renderAll();
    const syncOk = await guardar();
    if (syncOk) toast('Publicación eliminada', 'success');
    else toast('Eliminado localmente (sync pendiente)', 'error');
  } catch (e) { toast('Error al eliminar', 'error'); }
}

/* TOAST */
function toast(msg, type = 'info') {
  try {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
  } catch (e) {}
}

/* INIT */
function init() {
  cargarLocal();
  renderAll();
  try {
    onSnapshot(DOC_REF, (snap) => {
      try {
        if (!snap.exists()) return;
        const data = snap.data();
        const arr = Array.isArray(data.registros) ? data.registros : [];
        const limpios = [];
        for (let i = 0; i < arr.length; i++) { const s = sanitizarPost(arr[i]); if (s) limpios.push(s); }
        if (JSON.stringify(posts) !== JSON.stringify(limpios)) { posts = limpios; guardarLocal(); renderAll(); }
        setSyncEstado('online', 'Sincronizado');
      } catch (e) { setSyncEstado('offline', 'Error de datos'); }
    }, () => { setSyncEstado('offline', 'Sin conexión'); });
  } catch (e) { setSyncEstado('offline', 'Sin conexión'); }
  setInterval(() => { try { setSyncEstado('online', 'Sincronizado'); } catch {} }, 30000);
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('online', () => { setSyncEstado('online', 'Reconectado'); guardar(); });
window.addEventListener('offline', () => { setSyncEstado('offline', 'Sin conexión'); });
</script>
